<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #12161d;
        --panel: #1a2029;
        --border: #262d38;
        --text: #e7ebf1;
        --text-dim: #7c8698;
        --ok: #37d67a;
        --warn: #f5a623;
        --bad: #f0554c;
        --info: #6c93ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2px;
      }

      .header-icon {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .wordmark .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 6px var(--ok);
        flex-shrink: 0;
      }

      .wordmark h1 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.04em;
        margin: 0;
      }

      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin: 0 0 18px 16px;
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }

      .tab {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 8px 4px 10px;
        cursor: pointer;
        border-radius: 0;
      }

      .tab.active { color: var(--text); border-bottom-color: var(--info); }
      .tab:disabled { cursor: not-allowed; opacity: 0.4; }
      .tab:disabled:hover { border-color: transparent; }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }

      button {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 11px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }

      button:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

      .btn-primary { background: var(--info); color: #0c1017; border-color: var(--info); }
      .btn-primary:hover { background: #82a4ff; }
      .btn-secondary { background: transparent; color: var(--text); }
      .btn-secondary:hover { border-color: var(--text-dim); }

      .sheet-name {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: var(--text-dim);
        padding-bottom: 12px;
        margin-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }

      .sheet-name span { color: var(--text); }

      .gauge-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4px 0 18px;
      }

      .gauge-number {
        font-family: 'JetBrains Mono', monospace;
        font-size: 26px;
        font-weight: 700;
        margin-top: -34px;
      }

      .gauge-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-top: 2px;
      }

      .section-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin: 0 0 8px 2px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-bottom: 18px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
      }

      .card-top {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }

      .indicator {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--text-dim);
      }

      .indicator.ok { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
      .indicator.warn { background: var(--warn); box-shadow: 0 0 5px var(--warn); }
      .indicator.info { background: var(--info); }

      .card-label {
        font-size: 11px;
        color: var(--text-dim);
        line-height: 1.2;
      }

      .card-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 700;
      }

      .card-value.na { color: var(--text-dim); font-size: 16px; }

      .accordion {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        overflow: hidden;
      }

      .accordion summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
      }

      .accordion summary::-webkit-details-marker { display: none; }

      .accordion .row-main { flex: 1; min-width: 0; }
      .accordion .row-label { font-size: 12px; color: var(--text-dim); }
      .accordion .row-value { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; }
      .accordion .row-value.na { color: var(--text-dim); font-size: 12px; }

      .chevron {
        font-size: 10px;
        color: var(--text-dim);
        transition: transform 0.15s ease;
      }

      .accordion[open] .chevron { transform: rotate(180deg); }

      .accordion-detail {
        padding: 0 12px 12px 28px;
        border-top: 1px solid var(--border);
        margin-top: 2px;
        padding-top: 8px;
      }

      .detail-line {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        color: var(--text-dim);
        padding: 2px 0;
      }

      .detail-empty {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        color: var(--text-dim);
        font-style: italic;
      }

      .flat-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
      }
    </style>
  </head>

  <body>
    <div class="header-row">
      <div class="wordmark">
        <div class="dot"></div>
        <h1>SHEETPILOT</h1>
      </div>
      <img class="header-icon" src="https://raw.githubusercontent.com/lozanonicolas/SheetPilot/main/assets/sheetpilot_icon_only.png" alt="SheetPilot" />
    </div>
    <div class="eyebrow">Systems check</div>

    <div class="tabs">
      <button class="tab active" type="button">Analyzer</button>
      <button class="tab" type="button" disabled>Cleaner</button>
      <button class="tab" type="button" disabled>Settings</button>
    </div>

    <div class="controls">
      <button class="btn-primary" onclick="analyzeSheet()">Run Analysis</button>
      <button class="btn-secondary" onclick="highlightIssues()">Highlight Issues</button>
    </div>

    <div class="sheet-name">SHEET &nbsp;<span id="sheetName">N/A</span></div>

    <div id="gaugeWrap" class="gauge-wrap">
      <svg viewBox="0 0 120 66" width="140" height="77">
        <path d="M10,60 A50,50 0 0 1 110,60" fill="none" stroke="var(--border)" stroke-width="10" stroke-linecap="round" />
        <path id="gaugeArc" d="M10,60 A50,50 0 0 1 110,60" fill="none" stroke-width="10" stroke-linecap="round" />
      </svg>
      <div id="gaugeNumber" class="gauge-number">N/A</div>
      <div class="gauge-label">Quality Score</div>
    </div>

    <div class="section-label">At a glance</div>
    <div id="gridPanel" class="grid"></div>

    <div class="section-label">Checks</div>
    <div id="accordionPanel"></div>

    <script>
      function analyzeSheet() {
        google.script.run
          .withSuccessHandler(showAnalysis)
          .analyzeActiveSheet();
      }

      function highlightIssues() {
        google.script.run.highlightIssues();
      }

      // A result object with everything empty/null, used before the first
      // analysis runs so the sidebar never looks "broken" or blank.
      function placeholderResult() {
        return {
          name: null,
          rows: null,
          columns: null,
          emptyRows: null,
          emptyColumns: null,
          duplicateHeaders: [],
          missingHeaders: [],
          incompleteCells: [],
          dataTypeIssues: { cells: [], columnSummary: [] },
          formulaErrors: { cells: [], errorTypeCounts: {} },
          duplicateRows: [],
          notAnalyzed: true
        };
      }

      function gridCard(label, count, status, notAnalyzed) {
        if (notAnalyzed) {
          return `
            <div class="card">
              <div class="card-top"><div class="indicator"></div><div class="card-label">${label}</div></div>
              <div class="card-value na">N/A</div>
            </div>`;
        }

        const indicatorClass = status === 'info' ? 'info' : (count > 0 ? 'warn' : 'ok');

        return `
          <div class="card">
            <div class="card-top"><div class="indicator ${indicatorClass}"></div><div class="card-label">${label}</div></div>
            <div class="card-value">${count}</div>
          </div>`;
      }

      // Renders one expandable check. detailLines is an array of strings,
      // each becomes its own line inside the expanded panel.
      function accordionItem(label, count, detailLines, notAnalyzed) {
        if (notAnalyzed) {
          return `
            <div class="flat-row">
              <div class="indicator"></div>
              <div class="row-main"><div class="row-label">${label}</div></div>
              <div class="row-value na">N/A</div>
            </div>`;
        }

        const indicatorClass = count > 0 ? 'warn' : 'ok';
        const detailHtml = detailLines.length > 0
          ? detailLines.map(line => `<div class="detail-line">${line}</div>`).join('')
          : `<div class="detail-empty">No issues found</div>`;

        return `
          <details class="accordion">
            <summary>
              <div class="indicator ${indicatorClass}"></div>
              <div class="row-main"><div class="row-label">${label}</div></div>
              <div class="row-value">${count}</div>
              <div class="chevron">&#9662;</div>
            </summary>
            <div class="accordion-detail">${detailHtml}</div>
          </details>`;
      }

      // Converts a 1 indexed column number to spreadsheet letters: 1 -> A, 27 -> AA
      // Converts a 1 indexed column number to spreadsheet letters: 1 -> A, 27 -> AA
      // Converts a 1 indexed column number to spreadsheet letters: 1 -> A, 27 -> AA
      // Converts a 1 indexed column number to spreadsheet letters: 1 -> A, 27 -> AA
      function columnToLetter(col) {
        let letter = '';
        while (col > 0) {
          const remainder = (col - 1) % 26;
          letter = String.fromCharCode(65 + remainder) + letter;
          col = Math.floor((col - 1) / 26);
        }
        return letter;
      }

      function renderGauge(score, notAnalyzed) {
        const numberEl = document.getElementById('gaugeNumber');
        const arc = document.getElementById('gaugeArc');

        if (notAnalyzed) {
          numberEl.textContent = 'N/A';
          numberEl.style.color = 'var(--text-dim)';
          arc.style.stroke = 'transparent';
          return;
        }

        const arcLength = 157.08;
        const color = score >= 80 ? 'var(--ok)' : (score >= 50 ? 'var(--warn)' : 'var(--bad)');

        arc.style.stroke = color;
        arc.style.strokeDasharray = (score / 100 * arcLength) + ', ' + arcLength;
        numberEl.textContent = score;
        numberEl.style.color = color;
      }

      function showAnalysis(result) {
        const na = !!result.notAnalyzed;

        document.getElementById('sheetName').textContent = na ? 'N/A' : result.name;
        renderGauge(na ? null : result.qualityScore, na);

        const gridHtml = [
          gridCard('Rows', result.rows, 'info', na),
          gridCard('Columns', result.columns, 'info', na),
          gridCard('Empty Rows', result.emptyRows, null, na),
          gridCard('Empty Columns', result.emptyColumns, null, na),
          gridCard('Incomplete Cells', result.incompleteCells.length, null, na),
          gridCard('Duplicate Rows', result.duplicateRows.length, null, na)
        ].join('');
        document.getElementById('gridPanel').innerHTML = gridHtml;

        const duplicateHeaderLines = result.duplicateHeaders.map(
          h => `Col ${columnToLetter(h.column)} — "${h.text}"`
        );

        const missingHeaderLines = result.missingHeaders.map(
          h => `Col ${columnToLetter(h.column)}`
        );

        // Look up each column's dominant type + percentage so we can explain why a cell is flagged
        const dominantInfoByColumn = {};
        result.dataTypeIssues.columnSummary.forEach(s => {
          dominantInfoByColumn[s.column] = { type: s.dominantType, percentage: s.dominantPercentage };
        });

        const dataTypeLines = result.dataTypeIssues.cells.map(c => {
          const cellRef = columnToLetter(c.column) + c.row;
          const info = dominantInfoByColumn[c.column];
          return `Cell ${cellRef} — ${c.type} (column is ${info.percentage}% ${info.type})`;
        });

        const formulaErrorLines = result.formulaErrors.cells.map(
          c => `Cell ${columnToLetter(c.column)}${c.row} — ${c.errorType}`
        );

        const accordionHtml = [
          accordionItem('Duplicate Headers', result.duplicateHeaders.length, duplicateHeaderLines, na),
          accordionItem('Missing Headers', result.missingHeaders.length, missingHeaderLines, na),
          accordionItem('Type Inconsistencies', result.dataTypeIssues.cells.length, dataTypeLines, na),
          accordionItem('Formula Errors', result.formulaErrors.cells.length, formulaErrorLines, na)
        ].join('');
        document.getElementById('accordionPanel').innerHTML = accordionHtml;
      }

      // Load the sidebar with placeholder "N/A" state immediately, before any analysis runs.
      showAnalysis(placeholderResult());
    </script>
  </body>
</html>
