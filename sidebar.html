<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>

  <body>
    <h1>SheetPilot</h1>
    <p>Your Sheets™ productivity toolkit.</p>

    <button onclick="analyzeSheet()">Analyze Sheet</button>

    <script>
      function analyzeSheet() {
        google.script.run
          .withSuccessHandler(showAnalysis)
          .analyzeActiveSheet();
      }

      function showAnalysis(result) {
        const message = document.createElement('p');

        message.textContent = `Sheet: ${result.name} | Rows: ${result.rows} | Columns: ${result.columns}`;

        document.body.appendChild(message);
      }
    </script>
  </body>
</html>
