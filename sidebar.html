<!DOCTYPE html>
<html>
  <head>
    <base target="_top">

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 16px;
      }

      h1 {
        margin-top: 0;
      }

      button {
        width: 100%;
        padding: 10px;
        cursor: pointer;
        margin-bottom: 8px;
      }

      .results {
        margin-top: 20px;
      }

      .stat {
        margin-bottom: 12px;
      }

      .label {
        font-size: 12px;
        color: #666;
      }

      .value {
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>SheetPilot</h1>

    <p>Your Sheets™ productivity toolkit.</p>

    <button onclick="analyzeSheet()">Analyze Sheet</button>
    <button onclick="highlightIssues()">Highlight Issues</button>

    <div class="results">
      <div class="stat">
        <div class="label">Current Sheet</div>
        <div class="value" id="sheetName">-</div>
      </div>

      <div class="stat">
        <div class="label">Rows</div>
        <div class="value" id="rowCount">-</div>
      </div>

      <div class="stat">
        <div class="label">Columns</div>
        <div class="value" id="columnCount">-</div>
      </div>

      <div class="stat">
        <div class="label">Empty Rows</div>
        <div class="value" id="emptyRowCount">-</div>
      </div>

      <div class="stat">
        <div class="label">Empty Columns</div>
        <div class="value" id="emptyColumnCount">-</div>
      </div>

      <div class="stat">
        <div class="label">Duplicate Headers</div>
        <div class="value" id="duplicateHeaderCount">-</div>
        <div class="label" id="duplicateHeaderList"></div>
      </div>

      <div class="stat">
        <div class="label">Missing Headers</div>
        <div class="value" id="missingHeaderCount">-</div>
        <div class="label" id="missingHeaderList"></div>
      </div>

      <div class="stat">
        <div class="label">Incomplete Cells</div>
        <div class="value" id="incompleteCellCount">-</div>
      </div>
      <div class="stat">
        <div class="label">Data Type Inconsistencies</div>
        <div class="value" id="dataTypeInconsistencyCount">-</div>
        <div class="label" id="dataTypeInconsistencySummary"></div>
      </div>
      <div class="stat">
        <div class="label">Formula Errors</div>
        <div class="value" id="formulaErrorCount">-</div>
        <div class="label" id="formulaErrorSummary"></div>
      </div>
      <div class="stat">
        <div class="label">Duplicate Rows</div>
        <div class="value" id="duplicateRowCount">-</div>
      </div>

    <script>
      function analyzeSheet() {
        google.script.run
          .withSuccessHandler(showAnalysis)
          .analyzeActiveSheet();
      }

      function highlightIssues() {
        google.script.run.highlightIssues();
      }

      function showAnalysis(result) {
        document.getElementById('sheetName').textContent = result.name;
        document.getElementById('rowCount').textContent = result.rows;
        document.getElementById('columnCount').textContent = result.columns;
        document.getElementById('emptyRowCount').textContent = result.emptyRows;
        document.getElementById('emptyColumnCount').textContent = result.emptyColumns;

        document.getElementById('duplicateHeaderCount').textContent = result.duplicateHeaders.length;
        document.getElementById('duplicateHeaderList').textContent = result.duplicateHeaders.length > 0
          ? result.duplicateHeaders.map(h => h.text).join(', ')
          : '';

        document.getElementById('missingHeaderCount').textContent = result.missingHeaders.length;
        document.getElementById('missingHeaderList').textContent = result.missingHeaders.length > 0
          ? 'Column(s): ' + result.missingHeaders.map(h => h.column).join(', ')
          : '';

        document.getElementById('incompleteCellCount').textContent = result.incompleteCells.length;
        document.getElementById('dataTypeInconsistencyCount').textContent = result.dataTypeIssues.cells.length;

        const summaryEl = document.getElementById('dataTypeInconsistencySummary');
        summaryEl.textContent = result.dataTypeIssues.columnSummary.length > 0
          ? result.dataTypeIssues.columnSummary
              .map(s => `Col ${s.column} (${s.dominantType}): ${s.inconsistentCount} off`)
              .join(' · ')
          : '';

        document.getElementById('formulaErrorCount').textContent = result.formulaErrors.cells.length;

        const errorSummaryEl = document.getElementById('formulaErrorSummary');
        const errorEntries = Object.entries(result.formulaErrors.errorTypeCounts);
        errorSummaryEl.textContent = errorEntries.length > 0
          ? errorEntries.map(([type, count]) => `${type}: ${count}`).join(' · ')
          : '';

        document.getElementById('duplicateRowCount').textContent = result.duplicateRows.length;
      }
    </script>
  </body>
</html>
